name: Sincronizar avisos desde Airtable

on:
  schedule:
    # Cada 5 minutos. OJO: la primera vez GitHub puede tardar horas en
    # arrancar el cron. Mientras tanto usa "Run workflow" a mano.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate.mjs'
      - '.github/workflows/sincronizar-airtable.yml'

concurrency:
  group: sincronizar-airtable
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar data.json desde Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID || 'appOANzgalvLugPP1' }}
          AIRTABLE_TABLE_ID: ${{ vars.AIRTABLE_TABLE_ID || 'tblj3eagIgj8WOc5d' }}
        run: node scripts/generate.mjs

      - name: Publicar solo si ha cambiado algo
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json no ha cambiado. No se hace commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Actualizar avisos [skip ci]"
          git push
